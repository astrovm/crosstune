<!doctype html>
<!-- The light version of the Play feature graphic and link preview (1024x500). Render it
     with a headless browser at 2x, scale it to 1024x500, and save it as site/banner-light.png. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #17142b;
    background: radial-gradient(circle at 82% 30%, #ddd5ff 0, rgba(221,213,255,0) 420px), #f6f4ff;
    position: relative;
  }
  .text { position: absolute; left: 64px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; margin-bottom: 26px; }
  .logo img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { margin: 0; font-size: 54px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 800; }
  h1 em { font-style: normal; background: linear-gradient(transparent 62%, #b6f227 62%); }
  .chips { display: flex; flex-wrap: nowrap; gap: 7px; margin-top: 28px; white-space: nowrap; }
  .chips span { background: #fff; border: 1px solid #e3def7; border-radius: 999px; padding: 5px 12px; font-size: 14px; color: #57526e; }
  .shots img { position: absolute; width: 196px; border-radius: 26px; border: 1px solid #e3def7; box-shadow: 0 24px 60px rgba(30, 15, 110, .22); }
  .one { left: 610px; top: 46px; }
  .two { left: 802px; top: 104px; }
</style></head>
<body>
  <div class="text">
    <div class="logo"><img src="../docs/img/icon.png">Crosstune</div>
    <h1>Open any music link in <em>your</em> favorite app.</h1>
    <div class="chips"><span>Spotify</span><span>YouTube Music</span><span>Apple Music</span><span>Deezer</span><span>and more</span></div>
  </div>
  <div class="shots">
    <img class="one" src="../docs/img/screen-1-light.jpg">
    <img class="two" src="../docs/img/screen-7-light.jpg">
  </div>
</body></html>
