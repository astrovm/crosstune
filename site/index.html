<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="/img/icon.png">
{{alternates}}
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta property="og:title" content="Crosstune">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="https://crosstune.4st.li/img/og.png">
<meta property="og:url" content="https://crosstune.4st.li{{home}}">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f6f4ff; --surface: #ffffff; --text: #17142b; --muted: #57526e;
    --brand: #3b1fd1; --brand-ink: #ffffff; --accent: #b6f227; --line: #e3def7;
    color-scheme: light dark;
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0c1a; --surface: #18152b; --text: #ece9fb; --muted: #a7a1c4;
      --brand: #8f7bff; --brand-ink: #0e0c1a; --line: #2a2546;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0c1a; --surface: #18152b; --text: #ece9fb; --muted: #a7a1c4;
    --brand: #8f7bff; --brand-ink: #0e0c1a; --line: #2a2546;
    color-scheme: dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  a { color: var(--brand); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none; }
  .logo img { width: 36px; height: 36px; border-radius: 10px; }
  nav a { margin-left: 18px; color: var(--muted); text-decoration: none; font-size: .95rem; }
  nav a:hover { color: var(--text); }
  .icon-link { display: inline-flex; }
  .hero > * { min-width: 0; }
  .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; padding: 40px 0 48px; }
  h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; margin: 0 0 18px; letter-spacing: -.02em; }
  h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent) 62%); color: inherit; }
  .lede { font-size: 1.15rem; color: var(--muted); margin: 0 0 28px; max-width: 34em; }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 24px 13px 18px; border-radius: 999px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); color: var(--text); background: var(--surface); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; box-shadow: 0 8px 24px color-mix(in srgb, var(--brand) 35%, transparent); transition: transform .15s, box-shadow .15s; }
  .btn.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px color-mix(in srgb, var(--brand) 45%, transparent); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .note { font-size: .9rem; color: var(--muted); margin-top: 14px; }
  .shots { display: flex; justify-content: center; align-items: flex-start; gap: 14px; }
  .shots img { width: 46%; max-width: 240px; height: auto; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(30, 15, 110, .18); }
  .shots .second { margin-top: 48px; }
  .shots .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .shots .light { display: none; }
    :root:not([data-theme="light"]) .shots .dark { display: block; }
  }
  :root[data-theme="dark"] .shots .light { display: none; }
  :root[data-theme="dark"] .shots .dark { display: block; }
  .theme { display: grid; place-items: center; margin-left: 18px; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
  .theme:hover { color: var(--text); }
  .theme svg { width: 20px; height: 20px; fill: currentColor; }
  nav { display: flex; align-items: center; }
  section { padding: 40px 0; border-top: 1px solid var(--line); }
  h2 { font-size: 1.7rem; margin: 0 0 20px; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .card svg { flex: none; width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--bg); color: var(--brand); fill: currentColor; }
  .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  .works { margin-top: 32px; }
  .works h2 { font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .services { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .services li { display: flex; }
  .services svg { width: 28px; height: 28px; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  section { scroll-margin-top: 16px; }
  ol.steps { counter-reset: step; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0; margin: 0; list-style: none; }
  ol.steps li { counter-increment: step; display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; line-height: 1.5; }
  ol.steps li::before { content: counter(step); flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: .95rem; }
  ol.steps a { font-weight: 600; }
  footer { padding: 32px 0 48px; color: var(--muted); font-size: .9rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; justify-content: space-between; }
  footer a { color: var(--muted); }
  footer select { font: inherit; font-size: .9rem; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
  footer .heart { vertical-align: -2px; margin: 0 2px; }
  footer .links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
  footer .links a { padding: 8px 0; }
  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; padding-top: 24px; }
    .grid { grid-template-columns: 1fr 1fr; }
    ol.steps { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .hero { gap: 32px; padding-bottom: 40px; }
    .grid { grid-template-columns: 1fr; gap: 8px; }
    .buttons { flex-direction: column; }
    .btn { justify-content: center; }
    .card { padding: 12px 14px; gap: 12px; }
    .card svg { width: 36px; height: 36px; }
    .services { gap: 12px; }
    .services svg { width: 26px; height: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="{{home}}"><img src="/img/icon.png" alt="">Crosstune</a>
    <nav>
      <a class="icon-link" href="https://github.com/astrovm/crosstune" aria-label="{{github_label}}"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      <button class="theme" type="button" aria-label="{{theme_to_dark}}"></button>
    </nav>
  </header>

  <main>
    <div class="hero">
      <div>
        <h1>{{h1}}</h1>
        <p class="lede">{{lede}}</p>
        <div class="buttons">
          <a class="btn primary" href="https://github.com/astrovm/crosstune/releases/latest"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-337q-8 0-15-2.5t-13-8.5L308-492q-12-12-11.5-28t11.5-28q12-12 28.5-12.5T365-549l75 75v-286q0-17 11.5-28.5T480-800q17 0 28.5 11.5T520-760v286l75-75q12-12 28.5-11.5T652-548q11 12 11.5 28T652-492L508-348q-6 6-13 8.5t-15 2.5ZM240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Z"/></svg>{{download}}</a>
          <a class="btn" href="#google-play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>{{play_button}}</a>
        </div>
        <p class="note">{{note}}</p>
        <div class="works">
          <h2>{{works_with}}</h2>
          <ul class="services">
{{services}}
          </ul>
        </div>
      </div>
      <div class="shots">
        <img class="light" src="/img/screen-1-light.jpg" alt="{{alt_home}}" width="540" height="1200">
        <img class="dark" src="/img/screen-1-dark.jpg" alt="{{alt_home}}" width="540" height="1200">
        <img class="light second" src="/img/screen-7-light.jpg" alt="{{alt_picker}}" width="540" height="1200">
        <img class="dark second" src="/img/screen-7-dark.jpg" alt="{{alt_picker}}" width="540" height="1200">
      </div>
    </div>

    <section id="features">
      <h2>{{features_h2}}</h2>
      <div class="grid">
{{cards}}
      </div>
    </section>

    <section id="google-play">
      <h2>{{play_h2}}</h2>
      <ol class="steps">
{{play_steps}}
      </ol>
      <p class="note">{{play_note}}</p>
    </section>
  </main>

  <footer>
    <span>{{made_with}}</span>
    <span class="links"><a href="{{home}}privacy/">{{privacy_link}}</a> <a href="mailto:~@4st.li">~@4st.li</a>{{language_picker}}</span>
  </footer>
</div>
{{language_script}}
<script>
  const button = document.querySelector(".theme");
  const media = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (document.documentElement.dataset.theme || (media.matches ? "dark" : "light")) === "dark";
  const update = () => {
    button.innerHTML = '<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="' + (isDark() ? "M480-360q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Zm0 80q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM80-440q-17 0-28.5-11.5T40-480q0-17 11.5-28.5T80-520h80q17 0 28.5 11.5T200-480q0 17-11.5 28.5T160-440H80Zm720 0q-17 0-28.5-11.5T760-480q0-17 11.5-28.5T800-520h80q17 0 28.5 11.5T920-480q0 17-11.5 28.5T880-440h-80ZM480-760q-17 0-28.5-11.5T440-800v-80q0-17 11.5-28.5T480-920q17 0 28.5 11.5T520-880v80q0 17-11.5 28.5T480-760Zm0 720q-17 0-28.5-11.5T440-80v-80q0-17 11.5-28.5T480-200q17 0 28.5 11.5T520-160v80q0 17-11.5 28.5T480-40ZM226-678l-43-42q-12-11-11.5-28t11.5-29q12-12 29-12t28 12l42 43q11 12 11 28t-11 28q-11 12-27.5 11.5T226-678Zm494 495-42-43q-11-12-11-28.5t11-27.5q11-12 27.5-11.5T734-282l43 42q12 11 11.5 28T777-183q-12 12-29 12t-28-12Zm-42-495q-12-11-11.5-27.5T678-734l42-43q11-12 28-11.5t29 11.5q12 12 12 29t-12 28l-43 42q-12 11-28 11t-28-11ZM183-183q-12-12-12-29t12-28l43-42q12-11 28.5-11t27.5 11q12 11 11.5 27.5T282-226l-42 43q-11 12-28 11.5T183-183Zm297-297Z" : "M480-120q-151 0-255.5-104.5T120-480q0-138 90-239.5T440-838q13-2 23 3.5t16 14.5q6 9 6.5 21t-7.5 23q-17 26-25.5 55t-8.5 61q0 90 63 153t153 63q31 0 61.5-9t54.5-25q11-7 22.5-6.5T819-479q10 5 15.5 15t3.5 24q-14 138-117.5 229T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z") + '"/></svg>';
    button.setAttribute("aria-label", isDark() ? "{{theme_to_light}}" : "{{theme_to_dark}}");
  };
  button.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch (e) {}
    update();
  });
  media.addEventListener("change", update);
  update();
</script>
</body>
</html>
