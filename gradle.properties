# The PIT the app's mutants run on, and the one its plugin in tools/pitest-changed-lines builds and is tested against.
pitest.version=1.30.2
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Keep compilation in Gradle's heap instead of retaining another JVM beside the full test suite.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
