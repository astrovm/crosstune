// Types the Compose compiler is told are stable, so a composable handed a new copy that's equal to
// the last skips, rather than composing again for nothing (Issue #884).
//
// The app's state is immutable: UiState and what's in it are replaced with copy(...), and their
// lists, maps and sets are never changed in place. Without this, every class holding one is
// unstable, so UiState, Following, PlayerState, LyricLine and HistoryEntry were compared only by
// identity. Equal contents draw the same, so the only change is that those skip.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
// The phone's song recognizers: an Intent each, which Compose can't see into, picked once.
com.astrovm.crosstune.SongRecognizer
// The covers already worked out: one cache for the whole app, so only ever equal to itself.
com.astrovm.crosstune.Covers
// A song, album or playlist: its tracks are songs of its own kind, which the compiler can't call
// stable on its own, so it called every class holding one unstable.
com.astrovm.crosstune.MusicMetadata
// Where a link opens: a sealed class whose every kind is a data class of stable values, which the
// compiler doesn't look through to see.
com.astrovm.crosstune.Destination
