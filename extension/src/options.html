<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extName">Crosstune</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.4 system-ui, sans-serif; }
    body { margin: 0; padding: 24px; max-width: 420px; }
    h1 { font-size: 1.25rem; margin: 0 0 20px; }
    label { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; min-height: 48px; }
    label.stack { flex-direction: column; align-items: stretch; gap: 6px; }
    select { font: inherit; padding: 10px; min-height: 48px; }
    input[type="checkbox"] { width: 24px; height: 24px; }
    #access { margin: 0 0 16px; padding: 12px; border: 1px solid; border-radius: 8px; }
    #access button { font: inherit; margin-top: 8px; min-height: 48px; padding: 0 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1 data-i18n="extName">Crosstune</h1>
  <div id="access" hidden>
    <div data-i18n="optionsAccess">Crosstune needs access to the music sites to open links for you.</div>
    <button id="allow" type="button" data-i18n="optionsAllow">Allow</button>
  </div>
  <label><input id="enabled" type="checkbox"><span data-i18n="optionsEnabled">Open music links in the service below</span></label>
  <label class="stack"><span data-i18n="optionsService">Open in</span><select id="service"></select></label>
  <script src="options.js"></script>
</body>
</html>
