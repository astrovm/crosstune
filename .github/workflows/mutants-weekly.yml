name: Mutants weekly

# Mutation testing on all of the app's code (scripts/mutants-part/), where the Mutants workflow
# only does a pull request's changed lines. Every Kotlin line, in order, is split into 64 parts.
# All of them take a day of runner time, so each week runs a quarter, and four weeks cover
# everything. What lived goes in the open "Missed mutants" issue, for follow-up PRs. It never
# blocks anything.
#
# A pull request that changes this workflow or its script runs the script's tests and one real
# part, so a broken setup shows before Saturday.
on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      quarter:
        description: Which quarter of the parts to run, 0 to 3 (empty for this week's)
        required: false
  pull_request:
    paths:
      - scripts/mutants-part/**
      - .github/workflows/mutants-weekly.yml

permissions:
  contents: read

concurrency:
  group: mutants-weekly-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the script
        run: python3 -m unittest discover -s scripts/mutants-part -p "test_*.py"

      # A pull request tries the first part; a week runs its quarter.
      - name: Pick the parts
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          QUARTER: ${{ inputs.quarter }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo 'parts=[0]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          quarter=${QUARTER:-$(( $(date -u +%s) / 604800 % 4 ))}
          [[ $quarter =~ ^[0-3]$ ]] || { echo "Quarter must be 0 to 3, got $quarter" >&2; exit 1; }
          echo "parts=$(jq -cn --argjson q "$quarter" '[range($q * 16; $q * 16 + 16)]')" >> "$GITHUB_OUTPUT"

  part:
    name: Part ${{ matrix.part }} of 64
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Main's runs of CI save the caches; this one only reads them.
          cache-read-only: true

      # Lived changes are findings for the issue; only a run that never got to its tally fails.
      - name: Mutation testing
        run: python3 scripts/mutants-part/mutants_part.py "${{ matrix.part }}" 64 --gradle "./gradlew --build-cache --configuration-cache" --lived "$RUNNER_TEMP/lived.txt"

      - name: Upload what lived
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-${{ matrix.part }}
          path: |
            ${{ runner.temp }}/lived.txt
            app/build/reports/pitest/debug/
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, part]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: results

      - name: List what lived in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTS: ${{ needs.plan.outputs.parts }}
          JOBS: ${{ needs.part.result }}
        run: |
          lived=$(cat results/*/lived.txt 2>/dev/null | sort -u || true)
          parts=$(jq -r 'map(tostring) | join(", ")' <<< "$PARTS")
          issue=$(gh issue list --state open --search 'in:title "Missed mutants"' --json number --jq '.[0].number // empty')
          {
            echo "Parts $parts of 64: [run]($RUN), jobs $JOBS."
            echo
            if [ -z "$lived" ]; then
              echo 'Every change in these parts was caught by a test.'
            else
              echo "### Lived ($(wc -l <<< "$lived"))"
              echo 'No test noticed these changes. Real gaps get their own PR; changes that keep the same behavior can be ignored.'
              echo '```'
              echo "$lived"
              echo '```'
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file report.md
          elif [ -n "$lived" ]; then
            gh issue create --title 'Missed mutants' --body-file report.md
          fi
