name: Promote to production

# Sends a release from internal testing on to Google Play's production, with its English release notes and the
# store listing in the languages of PLAY_LANGUAGES, in one edit: one review a release. Production never goes to
# Google's review with a testing track. When the PLAY_TRACKS repository variable names testing tracks, the
# release comes from the first of them instead, with only its notes, as the listing went to review with them.
# A version not on that track is refused with an error, and so is one older than production's. So is one with
# no tag on origin, one while Play has a version code that no tag has, and one whose bundle on Play isn't the
# App Bundle the Release workflow made: its SHA-256 is in the release's notes. See "Releasing" in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to send to production, as in its tag (e.g. 2.26.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Every checkout prints Git's hint to name the initial branch. This is what it asks for.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  production:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions: {}
    # One Google Play job at a time, across the release, promote and store listing workflows: Play takes one edit
    # of an app at a time. GitHub keeps one job waiting in the group: a newer one cancels it, so re-run that one.
    concurrency:
      group: google-play
      cancel-in-progress: false
    steps:
      # Only the tools that talk to Google Play and the store text, so none of the app's build code is checked
      # out where the Play key is. Every version's notes are on main. play.sh lists the tags on origin itself,
      # with no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/play
            fastlane/metadata/android
          sparse-checkout-cone-mode: false

      # Bundler and fastlane at the versions Gemfile.lock pins and checks, before the key is there: installing a
      # gem runs its own code.
      - name: Install fastlane
        run: .github/play/play.sh setup

      # The commit asks Google Play to keep a review in progress. While one is, Play refuses it, nothing is
      # sent, and the job says to re-run it when the review ends. Go once the release is on internal testing.
      - name: Send the release to production
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Testing tracks, only when the release goes to review there first. None when it isn't set.
          PLAY_TRACKS: ${{ vars.PLAY_TRACKS }}
          # The listing's languages: folders of fastlane/metadata/android, with spaces between.
          PLAY_LANGUAGES: ${{ vars.PLAY_LANGUAGES }}
          # Reads the release's notes, which are public. This job has no permissions, so the token can do nothing
          # else: it only lifts the limit on requests with no token.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$PLAY_KEY_JSON" ]]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON isn't set, so nothing was sent to Google Play"
            exit 0
          fi
          .github/play/play.sh production "$VERSION"
