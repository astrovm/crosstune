name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests with coverage (95% line minimum)
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:koverLogDebug :app:koverXmlReportDebug :app:koverVerifyDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: TEMP uncovered lines
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, glob
          for f in glob.glob('app/build/reports/kover/*.xml'):
              r = ET.parse(f).getroot()
              for pkg in r.findall('package'):
                  for sf in pkg.findall('sourcefile'):
                      miss = [l.get('nr') for l in sf.findall('line') if int(l.get('mi')) > 0 and int(l.get('ci')) == 0]
                      part = [l.get('nr') for l in sf.findall('line') if int(l.get('mi')) > 0 and int(l.get('ci')) > 0]
                      if miss: print('UNCOVERED', pkg.get('name'), sf.get('name'), ' '.join(miss))
              for c in r.findall('counter'): print('TOTAL', c.attrib)
          PY

