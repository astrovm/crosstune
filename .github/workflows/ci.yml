name: CI

on:
  pull_request:
  # A run on main saves the Gradle and native caches, which only main can save and every pull request starts from.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes an in-progress run pointless; manual runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only changes the site, docs, store listing, the reports' Worker or their scripts skips the app's jobs.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
          printf '%s\n' "$files"
          # Any file outside these makes it the app's change.
          if grep -vE '^(README\.md$|CONTRIBUTING\.md$|AGENTS\.md$|LICENSE$|docs/|fastlane/|screenshots/|site/|report/|scripts/(build-site\.py$|test-site-[^/]*\.cjs$|shots/|milkdrop-render/|record/))' <<< "$files" > /dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  site:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Play Store changelog
        run: |
          python3 -m unittest discover -s scripts/release -p "test_*.py"
          python3 scripts/release/check_changelog.py

      # Ubuntu's mirror sometimes crawls at a few KB/s and the job runs out of time, so the
      # packages are kept between runs: on a new runner image, only what changed is fetched.
      - name: Name the package cache
        id: apt
        run: echo "key=apt-ffmpeg-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-ffmpeg-

      - name: Install media test tools
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update -qq
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o Acquire::Retries=3 ffmpeg
          # apt's own files are root's, and the cache is saved as the runner's user.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # The committed site has to be what build-site.py makes, new pages included.
      - name: Test site and media scripts
        run: |
          python3 scripts/build-site.py
          git add --intent-to-add docs/
          git diff --exit-code -- docs/
          python3 -m unittest discover -s scripts/milkdrop-render -p "test_*.py"
          python3 -m unittest discover -s scripts/shots -p "test_*.py"
          python3 -m unittest discover -s scripts/songcheck -p "test_*.py"
          node scripts/test-site-media.cjs
          node scripts/test-site-language.cjs
          node --test "report/*.test.mjs"

  # Unit tests with the 100% line coverage gate. They draw no visuals, so projectM isn't built.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # A shallow clone keeps the Git-derived version constant, so task outputs are reused across commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The build cache is enabled here rather than in gradle.properties: CodeQL's autobuild restores
      # Gradle's caches too, and a compile served from the cache leaves it no code to analyze.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest :pitest-changed-lines:test :app:koverLogDebug :app:koverXmlReportDebug :app:koverVerifyDebug --build-cache --configuration-cache

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
          retention-days: 14
          if-no-files-found: warn

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Lint
        run: ./gradlew :app:lintDebug :app:detekt --build-cache --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  # The debug and minified release APKs, with projectM built for each.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # projectM, which draws the MilkDrop visuals, is built from source.
          submodules: recursive

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # projectM is compiled six times, debug and release for three ABIs, and Gradle can't cache native
      # builds. ccache gives back the same objects for the same source, compiler and flags, so only
      # what changed is compiled again. Saved from main, like Gradle's caches.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: native
          max-size: 1G
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
          update-package-index: true

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease --build-cache --configuration-cache
        env:
          # CMake reads these to put ccache in front of the NDK's compilers.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # The NDK is installed again each run, so the compiler is told apart by its contents, not its date.
          CCACHE_COMPILERCHECK: content

      # F-Droid ships the GitHub APK only when its own build of the tag, in other folders, matches it.
      - name: Check the native library doesn't depend on where it's built
        run: python3 scripts/release/check_native_paths.py

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - site
      - test
      - lint
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The app's jobs are skipped, not failed, when only the site or docs changed.
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. == "success" or . == "skipped")' <<< "$RESULTS"
