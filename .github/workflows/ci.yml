name: CI

on:
  pull_request:
  # A run on main saves the Gradle and native caches, which only main can save and every pull request starts from.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every checkout prints Git's hint to name the initial branch. This is what it asks for.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# A newer push to the same pull request makes an in-progress run pointless; manual runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only changes the site, docs, store listing, the reports' Worker, the browser extension or their scripts skips the app's jobs.
  # One that changes the YouTube Music matcher, what it reads names and links with, its MatcherCasesTest or what main
  # opened in it runs that test in full.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      extension: ${{ steps.filter.outputs.extension }}
      matcher: ${{ steps.filter.outputs.matcher }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$PR" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            # A push to main ran it in its pull request already, and the weekly mutants workflow runs it too.
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "matcher=true" >> "$GITHUB_OUTPUT"
            else
              echo "matcher=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
          printf '%s\n' "$files"
          # Any file outside these makes it the app's change.
          if grep -vE '^(README\.md$|CONTRIBUTING\.md$|AGENTS\.md$|LICENSE$|docs/|fastlane/|site/|report/|extension/|ruff\.toml$|scripts/(ruff-requirements\.txt$|build-site\.py$|test-site-[^/]*\.cjs$|shots/|milkdrop-render/|record/|gradle-box/|reports/|ci-warnings/|perf/))' <<< "$files" > /dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          # The extension's tests also read README and the privacy page's strings.
          if grep -qE '^(extension/|README\.md$|site/strings/|\.github/workflows/ci\.yml$)' <<< "$files"; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^app/src/(main/java/com/astrovm/crosstune/(ExactMatcher|SongNames|CutTitle|MetadataParsers|Patterns|PhoneRegex|PhoneRegexTable|MusicLinks)\.kt|test/java/com/astrovm/crosstune/MatcherCasesTest\.kt|test/resources/matcher-(matrix|fuzz)-main\.tsv\.gz)$' <<< "$files"; then
            echo "matcher=true" >> "$GITHUB_OUTPUT"
          else
            echo "matcher=false" >> "$GITHUB_OUTPUT"
          fi

  # Every tracked Python file, against the rules in ruff.toml. The version is pinned in scripts/ruff-requirements.txt,
  # so a new ruff never fails a pull request that didn't touch Python; Renovate proposes the bump as its own.
  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Python scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install --disable-pip-version-check --quiet -r scripts/ruff-requirements.txt
          "$RUNNER_TEMP/ruff/bin/ruff" check --output-format github

      # Every tracked shell script. A finding is fixed, never silenced, as with ruff.
      - name: Lint the shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  site:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Play Store changelog and texts
        run: |
          python3 scripts/release/check_changelog.py
          python3 scripts/release/check_store_text.py

      # Ubuntu's mirror sometimes crawls at a few KB/s and the job runs out of time, so the
      # packages are kept between runs: on a new runner image, only what changed is fetched.
      - name: Name the package cache
        id: apt
        run: echo "key=apt-ffmpeg-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-ffmpeg-

      - name: Install media test tools
        run: |
          mkdir -p ~/apt-archives/partial
          # The list of packages is only needed when a package isn't in the kept archives. A runner that
          # can't look a name up waits on it for minutes, so it gets a minute and then the job goes on.
          sudo timeout 60 apt-get update -qq || echo "::notice::apt-get update did not finish, installing from what is kept"
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o Acquire::Retries=5 ffmpeg
          # apt's own files are root's, and the cache is saved as the runner's user.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # The readings guard parses Kotlin and Java with the Kotlin compiler, and syncreplay's tests ask it what to compile.
      - uses: ./.github/actions/jdk
        with:
          gradle: none
          kotlinc: true

      - name: Read the pinned Whisper headers for the JNI test
        run: git submodule update --init --depth 1 -- third_party/whisper.cpp

      # The committed site has to be what build-site.py makes, new pages included. Then each folder's tests under
      # scripts/, the release, readings and mutants scripts' too, which other workflows also run before they use them.
      - name: Test the site and the scripts
        run: |
          python3 scripts/build-site.py
          git add --intent-to-add docs/
          git diff --exit-code -- docs/
          python3 scripts/unittests.py
          bash scripts/device-check-build.test.sh
          node scripts/test-site-media.cjs
          node scripts/test-site-language.cjs
          node --test "report/*.test.mjs"

  # What the release, promote and store listing workflows send to Google Play: .github/play/play.sh with the real
  # fastlane of Gemfile.lock, against a fake Play. Every commit has to keep a review in progress, and production
  # never shares an edit with another track. The runner's own Ruby, as those workflows use.
  play:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: .github/play/Gemfile
      BUNDLE_FROZEN: "true"
      BUNDLE_WITHOUT: ""
      BUNDLE_PATH: ${{ github.workspace }}/../play-gems
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/play
          sparse-checkout-cone-mode: false

      - name: Test the Google Play steps
        run: |
          ruby --version
          .github/play/play.sh setup
          bundle exec ruby .github/play/test/play_test.rb

  # The panel test uses a local fixture. The tests that follow real links run by hand (see extension/README.md).
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run package
      - run: npm test
      # The runner supplies Chromium's libraries. Playwright reports a missing library before the test.
      - run: npx playwright install chromium
      - run: npm run e2e:panel

  # Unit tests with the 100% line coverage gate. They draw no visuals, so projectM isn't built.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    # Main also warms lint, release builds and PIT on a shared-cache miss.
    timeout-minutes: 30
    steps:
      # A shallow clone keeps the Git-derived version constant, so task outputs are reused across commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/jdk
        id: jdk

      # The build cache is enabled here rather than in gradle.properties: CodeQL's autobuild restores
      # Gradle's caches too, and a compile served from the cache leaves it no code to analyze.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest :pitest-changed-lines:test :app:koverLogDebug :app:koverXmlReportDebug :app:koverVerifyDebug --build-cache --configuration-cache

      # Lint, release builds and PIT resolve artifacts the unit tests do not. Run the real tasks so
      # every job starts from their dependencies too; a dry run would not download them.
      - name: Resolve the other jobs' dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.jdk.outputs.dependencies-hit != 'true'
        run: ./gradlew :app:lintDebug :app:detekt :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:cachePitestDependencies --build-cache --configuration-cache

      # The cache is immutable. An exact hit needs no save; a new build-file hash gets a new key.
      - name: Save Gradle dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.jdk.outputs.dependencies-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.jdk.outputs.dependencies-key }}

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          # The results' XML too: it has when each class started, so how the classes were split between the test
          # processes, and which one ran longest, can be read from a run.
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/kover/
          retention-days: 14
          if-no-files-found: warn

  # The tests that count how the work of reading grows (Growth.kt). A count is the same on any runner. They run
  # apart from the test job, which they'd otherwise add minutes to, as counting runs the JVM without its fast compiler.
  growth:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/jdk

      - name: Count growth
        run: ./gradlew :app:growthTests --build-cache --configuration-cache

      - name: Upload the growths
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: growth
          path: |
            app/build/reports/tests/growthTests/
            app/build/growth/
          retention-days: 14
          if-no-files-found: warn

  # The fuzzes the test job reads one case in 20 of (Fuzz.kt), each case: TitlesAgainstMainTest's 200,000 titles against
  # main's readings, and the letters, titles, patterns and dashes of the rest.
  fuzz:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/jdk

      - name: Every case of each fuzz
        run: >-
          ./gradlew :app:testDebugUnitTest -PfuzzFull --build-cache --configuration-cache
          --tests com.astrovm.crosstune.TitlesAgainstMainTest --tests com.astrovm.crosstune.PatternLettersTest
          --tests com.astrovm.crosstune.CutTitleTest --tests com.astrovm.crosstune.LinearPatternsTest
          --tests com.astrovm.crosstune.ArtistBeforeTest

      - name: Upload the differences
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/titles-differences.tsv
          retention-days: 14
          if-no-files-found: warn

  # MatcherCasesTest's whole matrix and all its made-up searches, where the test job runs one in 20 of them.
  matcher:
    needs: changes
    if: needs.changes.outputs.matcher == 'true'
    uses: ./.github/workflows/matcher.yml

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The golden readings check reads the pull request's body.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request merged into main, and main before it, to see what it adds to detekt's baseline.
          fetch-depth: 2

      # The pull request keeps every locked reading, and a readings change changes the golden file.
      # Its marks are lines of its body, read as the body is now: after an edit, run this job again.
      # The step runs the checker main has, copied out of main's commit, and imports no file of the pull request:
      # a pull request can't loosen it by editing the checker or the code it imports. Only the pull request that
      # adds the checker, when main has none, is checked by its own. test_check_golden.py runs this step.
      - name: A pull request keeps the locked readings
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          JMDICT_BOT: ${{ github.event.pull_request.head.ref == 'jmdict/remake' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          # HEAD^1 is the base the pull request merges into. The lock is main's, so a pull request into another
          # branch, one stacked on another pull request, is checked once it goes into main.
          if [ "$BASE_REF" != main ]; then
            echo "::error::This pull request goes into $BASE_REF. The golden readings are checked against main: point it at main."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          checker=scripts/readingsaudit/check_golden.py
          # ls-tree fails when HEAD^1 is not there, which stops the step, and prints nothing when main has no checker yet.
          # It is a line of its own: in a test, set -e would not see it fail.
          listed=$(git ls-tree --name-only HEAD^1 -- "$checker")
          if [ -n "$listed" ]; then
            mkdir -p "$RUNNER_TEMP/golden-base"
            git archive HEAD^1 scripts/readingsaudit | tar -x -C "$RUNNER_TEMP/golden-base"
            checker="$RUNNER_TEMP/golden-base/$checker"
          fi
          # -E and -s: no PYTHONPATH and no user site, so Python finds the golden code next to the checker only.
          proposal="${checker%/*}/proposal.py"
          if [ "${JMDICT_BOT:-false}" = true ] && [ -f "$proposal" ]; then
            # Check the generation against both the CI merge base and current main.
            head=$(git rev-parse HEAD^2)
            git fetch --unshallow --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "$head"
            for base in HEAD^1 origin/main; do
              python3 -E -s "$proposal" verify "$base" "$head" \
                app/src/main/resources/com/astrovm/crosstune \
                app/src/test/resources/com/astrovm/crosstune/jmdict-notice-texts.txt "$RUNNER_TEMP/pr-body.md"
            done
          fi
          python3 -E -s "$checker" --repo "$GITHUB_WORKSPACE" --base HEAD^1 --head HEAD --body-file "$RUNNER_TEMP/pr-body.md"

      # Tangled new code is split up, never listed in detekt's baseline to pass.
      - name: Detekt's baseline only shrinks
        if: github.event_name == 'pull_request'
        run: |
          # The diff is taken first, so a git diff that fails stops the step instead of reading as no change.
          # --text, so a .gitattributes that calls the file binary can't hide what it adds.
          diff=$(git diff --text HEAD^1 HEAD -- config/detekt/baseline.xml)
          # Only grep's "no match" (exit 1) means nothing was added. Any other failure stops the step.
          added=$(grep '^+.*<ID>' <<< "$diff") || [ $? = 1 ]
          if [ -n "$added" ]; then
            echo "::error file=config/detekt/baseline.xml::This adds to detekt's baseline. Split the code it flags up instead."
            echo "$added"
            exit 1
          fi

      # The workflows, with shellcheck on their scripts. actionlint's own release, checked against the
      # SHA-256 its checksums file gives for that version.
      - name: Lint workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # actionlint skips the scripts without a word when shellcheck is missing.
          if ! command -v shellcheck > /dev/null; then
            echo "::error::shellcheck isn't on this runner, so actionlint wouldn't check the workflows' scripts"
            exit 1
          fi
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - uses: ./.github/actions/jdk

      - name: Lint
        run: ./gradlew :app:lintDebug :app:detekt --build-cache --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  # The debug and minified release APKs, with projectM built for each.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # projectM, which draws the MilkDrop visuals, is built from source.
          submodules: recursive

      - uses: ./.github/actions/jdk

      # projectM is compiled six times, debug and release for three ABIs, and Gradle can't cache native
      # builds. ccache gives back the same objects for the same source, compiler and flags, so only
      # what changed is compiled again. Saved from main, like Gradle's caches.
      # A cache only saves time, so the build goes on without it when it can't be set up.
      - uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        id: ccache
        continue-on-error: true
        with:
          key: native
          max-size: 1G
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
          # ccache's own release, checked against the action's SHA-256, not apt: the runners could not
          # look up Ubuntu's mirrors for hours on 2026-11-11, and every build failed before it began.
          install: binary

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:notices --build-cache --configuration-cache
        env:
          # CMake reads these to put ccache in front of the NDK's compilers. Empty, it uses none.
          CMAKE_C_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
          # The NDK is installed again each run, so the compiler is told apart by its contents, not its date.
          CCACHE_COMPILERCHECK: content

      # F-Droid ships the GitHub APK only when its own build of the tag, in other folders, matches it.
      - name: Check the native library doesn't depend on where it's built
        run: python3 scripts/release/check_native_paths.py

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - python
      - site
      - extension
      - test
      - growth
      - fuzz
      - matcher
      - lint
      - build
      - play
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The app's jobs are skipped, not failed, when only the site or docs changed.
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. == "success" or . == "skipped")' <<< "$RESULTS"
