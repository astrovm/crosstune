name: CI

on:
  pull_request:
  # A run on main saves the Gradle and native caches, which only main can save and every pull request starts from.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every checkout prints Git's hint to name the initial branch. This is what it asks for.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# A newer push to the same pull request makes an in-progress run pointless; manual runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only changes the site, docs, store listing, the reports' Worker, the browser extension or their scripts skips the app's jobs.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "extension=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" -q '.[].filename')
          printf '%s\n' "$files"
          # Any file outside these makes it the app's change.
          if grep -vE '^(README\.md$|CONTRIBUTING\.md$|AGENTS\.md$|LICENSE$|docs/|fastlane/|screenshots/|site/|report/|extension/|scripts/(build-site\.py$|test-site-[^/]*\.cjs$|shots/|milkdrop-render/|record/|gradle-box/|reports/|ci-warnings/))' <<< "$files" > /dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^extension/' <<< "$files"; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi

  site:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Play Store changelog and texts
        run: |
          python3 -m unittest discover -s scripts/release -p "test_*.py"
          python3 scripts/release/check_changelog.py
          python3 scripts/release/check_store_text.py

      # Ubuntu's mirror sometimes crawls at a few KB/s and the job runs out of time, so the
      # packages are kept between runs: on a new runner image, only what changed is fetched.
      - name: Name the package cache
        id: apt
        run: echo "key=apt-ffmpeg-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-ffmpeg-

      - name: Install media test tools
        run: |
          mkdir -p ~/apt-archives/partial
          # The list of packages is only needed when a package isn't in the kept archives. A runner that
          # can't look a name up waits on it for minutes, so it gets a minute and then the job goes on.
          sudo timeout 60 apt-get update -qq || echo "::notice::apt-get update did not finish, installing from what is kept"
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" -o Acquire::Retries=5 ffmpeg
          # apt's own files are root's, and the cache is saved as the runner's user.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # The committed site has to be what build-site.py makes, new pages included.
      - name: Test site and media scripts
        run: |
          python3 scripts/build-site.py
          git add --intent-to-add docs/
          git diff --exit-code -- docs/
          python3 -m unittest discover -s scripts/milkdrop-render -p "test_*.py"
          python3 -m unittest discover -s scripts/shots -p "test_*.py"
          python3 -m unittest discover -s scripts/songcheck -p "test_*.py"
          python3 -m unittest discover -s scripts/readingsaudit -p "test_*.py"
          python3 -m unittest discover -s scripts/syncreplay -p "test_*.py"
          python3 -m unittest discover -s scripts/contrast -p "test_*.py"
          python3 -m unittest discover -s scripts/gradle-box -p "test_*.py"
          python3 -m unittest discover -s scripts/emulator -p "test_*.py"
          python3 -m unittest scripts/test_devicelock.py
          python3 -m unittest scripts/test_notices.py
          python3 -m unittest discover -s scripts/record -p "test_*.py"
          python3 -m unittest discover -s scripts/reports -p "test_*.py"
          python3 -m unittest discover -s scripts/jtotal-widths -p "test_*.py"
          python3 -m unittest discover -s scripts/lyrics -p "test_*.py"
          python3 -m unittest discover -s scripts/ci-warnings -p "test_*.py"
          node scripts/test-site-media.cjs
          node scripts/test-site-language.cjs
          node --test "report/*.test.mjs"

  # The browser extension in extension/, built and tested only when its files change. Its lyrics panel's browser test answers everything itself; the two that follow real links need the network, so they run by hand (see CONTRIBUTING.md).
  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm run package
      - run: npm test
      # The browser comes from Playwright's own host. What it needs from apt is mostly on the runner
      # already, so apt gets two minutes and the test then says whether anything was missing.
      - run: npx playwright install chromium
      - run: timeout 120 npx playwright install-deps chromium || echo "::notice::Playwright's apt packages were not installed"
      - run: npm run e2e:panel

  # Unit tests with the 100% line coverage gate. They draw no visuals, so projectM isn't built.
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # A shallow clone keeps the Git-derived version constant, so task outputs are reused across commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The build cache is enabled here rather than in gradle.properties: CodeQL's autobuild restores
      # Gradle's caches too, and a compile served from the cache leaves it no code to analyze.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest :pitest-changed-lines:test :app:koverLogDebug :app:koverXmlReportDebug :app:koverVerifyDebug --build-cache --configuration-cache

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
          retention-days: 14
          if-no-files-found: warn

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merged into main, and main before it, to see what it adds to detekt's baseline.
          # A run started by hand gets main's history too, to compare its branch with where it left main.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      # Tangled new code is split up, never listed in detekt's baseline to pass. A run started by hand
      # checks it too, as its CI / Required stands for a pull request's (the JMdict workflow's).
      - name: Detekt's baseline only shrinks
        if: github.event_name != 'push'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then base=HEAD^1; else base=$(git merge-base origin/main HEAD); fi
          added=$(git diff "$base" HEAD -- config/detekt/baseline.xml | grep '^+.*<ID>' || true)
          if [ -n "$added" ]; then
            echo "::error file=config/detekt/baseline.xml::This adds to detekt's baseline. Split the code it flags up instead."
            echo "$added"
            exit 1
          fi

      # The workflows, with shellcheck on their scripts. actionlint's own release, checked against the
      # SHA-256 its checksums file gives for that version.
      - name: Lint workflows
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # actionlint skips the scripts without a word when shellcheck is missing.
          if ! command -v shellcheck > /dev/null; then
            echo "::error::shellcheck isn't on this runner, so actionlint wouldn't check the workflows' scripts"
            exit 1
          fi
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$tarball"
          echo "$SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint
        run: ./gradlew :app:lintDebug :app:detekt --build-cache --configuration-cache

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  # The debug and minified release APKs, with projectM built for each.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # projectM, which draws the MilkDrop visuals, is built from source.
          submodules: recursive

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # projectM is compiled six times, debug and release for three ABIs, and Gradle can't cache native
      # builds. ccache gives back the same objects for the same source, compiler and flags, so only
      # what changed is compiled again. Saved from main, like Gradle's caches.
      # A cache only saves time, so the build goes on without it when it can't be set up.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        id: ccache
        continue-on-error: true
        with:
          key: native
          max-size: 1G
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
          # ccache's own release, checked against the action's SHA-256, not apt: the runners could not
          # look up Ubuntu's mirrors for hours on 2026-11-11, and every build failed before it began.
          install: binary

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:notices --build-cache --configuration-cache
        env:
          # CMake reads these to put ccache in front of the NDK's compilers. Empty, it uses none.
          CMAKE_C_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
          # The NDK is installed again each run, so the compiler is told apart by its contents, not its date.
          CCACHE_COMPILERCHECK: content

      # F-Droid ships the GitHub APK only when its own build of the tag, in other folders, matches it.
      - name: Check the native library doesn't depend on where it's built
        run: python3 scripts/release/check_native_paths.py

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped. Also on a run started
    # by hand: the JMdict workflow's pull request gets its checks that way, as its token starts no workflow.
    if: ${{ always() && github.event_name != 'push' }}
    needs:
      - changes
      - site
      - extension
      - test
      - lint
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The app's jobs are skipped, not failed, when only the site or docs changed.
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. == "success" or . == "skipped")' <<< "$RESULTS"
