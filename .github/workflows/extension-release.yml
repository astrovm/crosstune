name: Extension release

# A new version in extension/package.json, merged to main, goes to each store whose keys are set
# (see extension/scripts/publish.ts), then is tagged extension-<version>. No GitHub release: the app
# looks for its own updates in the latest one.
on:
  push:
    branches: [main]
    paths: [extension/package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # the tag
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this version new?
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/extension-$version" > /dev/null; then
            echo "extension-$version went out already"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - if: steps.version.outputs.new == 'true'
        run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - if: steps.version.outputs.new == 'true'
        run: npm run typecheck
      - if: steps.version.outputs.new == 'true'
        run: npm run package
      - if: steps.version.outputs.new == 'true'
        run: npm test

      - if: steps.version.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crosstune-extension-${{ steps.version.outputs.version }}
          path: extension/dist/crosstune-*.zip
          if-no-files-found: error

      - name: Send to the stores
        if: steps.version.outputs.new == 'true'
        run: npm run stores
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}

      # Only once every store with keys took it. When one fails, the run fails untagged: send that
      # store the run's zip by hand, or bump the version, as the stores that took it won't take it twice.
      - name: Tag the version
        if: steps.version.outputs.new == 'true'
        env:
          TAG: extension-${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
