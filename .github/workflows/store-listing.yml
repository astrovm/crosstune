name: Store listing

# Sends the Google Play listing (name, descriptions, screenshots, banner) from fastlane/metadata/android, on its
# own. Each release sends the listing already, in the same edit as the release, so Google reviews both at once.
# This is for the times between, by hand: each run that isn't a check goes to Google's review. See "Releasing"
# in CONTRIBUTING.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to read the listing from"
        required: true
        default: main
        type: string
      languages:
        description: "Folders of fastlane/metadata/android to send, with spaces between"
        required: true
        default: en-US
        type: string
      check_only:
        description: "Only ask Google Play whether it would take the listing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Every checkout prints Git's hint to name the initial branch. This is what it asks for.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  listing:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release
    permissions: {}
    # One Google Play job at a time, across the release, promote and store listing workflows: Play takes one edit
    # of an app at a time. GitHub keeps one job waiting in the group: a newer one cancels it, so re-run that one.
    concurrency:
      group: google-play
      cancel-in-progress: false
    steps:
      # Only the tools that talk to Google Play, from this workflow's own commit, and the listing's words and
      # pictures from the ref asked for. None of the app's build code is checked out where the Play key is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: .github/play
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: listing
          persist-credentials: false
          sparse-checkout: fastlane/metadata/android
          sparse-checkout-cone-mode: false

      # Bundler and fastlane at the versions Gemfile.lock pins and checks, before the key is there: installing a
      # gem runs its own code.
      - name: Install fastlane
        run: tools/.github/play/play.sh setup

      # Every commit asks Google Play to keep a review in progress. While one is, Play refuses it, nothing is
      # sent, and the job says to re-run it when the review ends.
      - name: Send the listing to Google Play
        working-directory: listing
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_KEY_JSON }}
          PLAY_LANGUAGES: ${{ inputs.languages }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [[ -z "$PLAY_KEY_JSON" ]]; then
            echo "::notice::PLAY_KEY_JSON isn't set, so the listing wasn't sent to Google Play"
            exit 0
          fi
          ../tools/.github/play/play.sh listing
