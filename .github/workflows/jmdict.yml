name: JMdict

# The app's jmdict-readings.txt and old-kana.txt are made from JMdict. The EDRDG licence (section 4)
# asks for a way to update that data regularly from its newest version. Each month this fetches the
# newest jmdict-eng of jmdict-simplified, remakes both lists, and copies the two EDRDG pages.
# It opens one pull request for the changes, or brings the open one up to date. The release fails when a file's JMdict
# is older than readingsaudit.py's MAX_AGE_DAYS.
#
# fetch takes jmdict-eng by its release's tag, and keeps it only if it has the size and SHA-256 the release gives. A tag
# whose JMdict is older than the committed files' stops table and oldkana with that reason: the licence asks for the
# newest version, so a remake never goes back. propose.sh pushes jmdict/remake, always made again from the newest main,
# and pushes it again when main has moved or the lists have changed since. It stops when a person has pushed to that
# branch. When the repository doesn't let Actions create pull requests, the run pushes the branch and fails, and the
# next run opens the pull request. propose.test.sh tries propose.sh on a local repository with a fake gh.
#
# A pull request that changes this workflow or the scripts it runs remakes the files the same way,
# and shows what changed, but opens nothing.
on:
  schedule:
    - cron: "41 4 3 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: A jmdict-simplified release tag (empty for the newest)
        required: false
  pull_request:
    paths:
      - .github/workflows/jmdict.yml
      - scripts/readingsaudit/**
      - scripts/kotlinc/**
      - scripts/notices.py
      - scripts/test_notices.py
      - app/src/test/java/com/astrovm/crosstune/songcheck/JmdictReadings.kt

permissions:
  contents: read

# Every checkout prints Git's hint to name the initial branch. This is what it asks for.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The one pull request's branch.
  BRANCH: jmdict/remake
  TABLES: app/src/main/resources/com/astrovm/crosstune
  NOTICE_MANIFEST: app/src/test/resources/com/astrovm/crosstune/jmdict-notice-texts.txt

concurrency:
  group: jmdict-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The build's code runs here, with a token that can only read.
  remake:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.fetch.outputs.tag }}
      source_commit: ${{ steps.snapshot-base.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the snapshot base
        id: snapshot-base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Gradle builds with this JDK, and the readings guard's tests parse with the Kotlin compiler on it.
      - uses: ./.github/actions/jdk
        with:
          gradle: read-only
          kotlinc: true

      - name: Test the scripts
        run: |
          python3 -m unittest discover -s scripts/readingsaudit -p "test_*.py"
          python3 -m unittest discover -s scripts -p test_notices.py
          bash scripts/readingsaudit/propose.test.sh
          shellcheck scripts/readingsaudit/*.sh

      # Taken by its release's tag, and kept only with the size and SHA-256 the release gives.
      - name: Fetch JMdict
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          READINGSAUDIT_DIR: ${{ runner.temp }}/jmdict
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          # It writes tag= to GITHUB_OUTPUT, once the tag has the form of jmdict-simplified's.
          python3 scripts/readingsaudit/readingsaudit.py fetch "${args[@]}"

      # The same commands as by hand, with Gradle run plainly, as CI runs it, instead of in the build box.
      - name: Refresh the word lists and notices
        env:
          READINGSAUDIT_DIR: ${{ runner.temp }}/jmdict
        run: |
          python3 scripts/readingsaudit/readingsaudit.py table --gradle "./gradlew --build-cache --configuration-cache"
          python3 scripts/readingsaudit/readingsaudit.py oldkana
          # The headers the script writes are the ones its tests ask for.
          python3 -m unittest discover -s scripts/readingsaudit -p "test_*.py"
          # GitHub's runners sometimes can't reach edrdg.org for hours (Issue #1160). A pull request's run then keeps the
          # committed pages and warns; the scheduled run, which proposes the update, stays strict.
          python3 scripts/notices.py fetch-jmdict ${{ github.event_name == 'pull_request' && '--keep-if-unreachable' || '' }}
          git diff --stat -- "$TABLES" "$NOTICE_MANIFEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmdict-snapshot
          path: |
            ${{ env.TABLES }}/jmdict-readings.txt
            ${{ env.TABLES }}/old-kana.txt
            ${{ env.TABLES }}/notices/edrdg-licence.txt
            ${{ env.TABLES }}/notices/jmdict-documentation.txt
            ${{ env.NOTICE_MANIFEST }}
          retention-days: 14
          if-no-files-found: error

  # Only what remake made is committed here. Nothing from the build runs where the token can write.
  propose:
    needs: remake
    if: github.event_name != 'pull_request' && github.repository == 'astrovm/crosstune'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The branch's commits since main, to tell the workflow's own from a person's.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jmdict-snapshot
          path: app/src

      # remake has run propose.test.sh.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.remake.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.remake.outputs.source_commit }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/readingsaudit/propose.sh
