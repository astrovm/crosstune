name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the selected branch (e.g. v1.0.7)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; push it to trigger a release instead"
              exit 1
            fi
            # Tag locally before building so the Git-derived versionName matches the release.
            git tag "$TAG"
          fi
          described="$(git describe --tags --abbrev=0)"
          if [[ "$described" != "$TAG" ]]; then
            echo "::error::git describe resolves to '$described', expected '$TAG'"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify version metadata
        run: |
          expected="${TAG#v}"
          actual="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK versionName is '$actual', expected '$expected'"
            exit 1
          fi

      - name: Sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          out="$RUNNER_TEMP/Crosstune-$TAG.apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$out" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          certs="$("$apksigner" verify --print-certs "$out")"
          echo "$certs"
          rm -f "$keystore"
          # apksigner labels the line "Signer #1" or "V3.0 Signer" depending on the signature schemes used.
          cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$certs" | head -n1)"
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::Could not read the signing certificate digest"
            exit 1
          fi
          echo "APK=$out" >> "$GITHUB_ENV"
          echo "CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Crosstune-${{ env.TAG }}
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lets users and tools like Obtainium check the APK's signer before installing.
          notes="Signing certificate SHA-256: \`$CERT_SHA256\`"
          args=(--repo "$GITHUB_REPOSITORY" --title "Crosstune $TAG" --notes "$notes" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            # The tag only exists locally; gh creates it on the built commit.
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "$APK" "${args[@]}"
