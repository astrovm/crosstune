name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the selected branch (e.g. v1.0.7)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Every checkout prints Git's hint to name the initial branch. This is what it asks for.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

# Separate jobs, so the build's third-party code (Gradle plugins and dependencies) never runs
# where the signing key or a token that can write to the repository is available.
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Check Play Store changelog
        run: python3 scripts/release/check_changelog.py

      # The EDRDG licence asks for JMdict's data to be kept up to date. The JMdict workflow remakes the
      # word lists each month; a release with older ones than readingsaudit.py's MAX_AGE_DAYS stops here.
      - name: Check the JMdict word lists are recent
        run: python3 scripts/readingsaudit/readingsaudit.py age

      # A tag with a suffix, as in v2.27.0-rc.1, is a pre-release: its version code is the one of 2.27.0.
      - name: Validate tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; push it to trigger a release instead"
              exit 1
            fi
          elif ! git tag --points-at HEAD | grep -qxF "$TAG"; then
            echo "::error::Tag $TAG doesn't point at the commit being built"
            exit 1
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # The same checks as CI, which also build the minified release APKs, plus the App Bundle that
      # Google Play needs. "play" is the build Google Play and GitHub ship; "foss" is the same app with
      # no Google code, for F-Droid, and is signed and published beside it.
      - name: Test, lint and build
        run: ./gradlew :app:ci :app:bundlePlayRelease --build-cache

      # Each licence text in Settings → About → Licenses is still the one its work publishes, fetched
      # again; the NDK's own notice is read from the NDK the build above installed.
      - name: Check licence texts against their sources
        run: python3 scripts/notices.py check

      - name: Verify version metadata
        run: |
          expected="${TAG#v}"
          actual="$(jq -r '.elements[0].versionName' app/build/outputs/apk/play/release/output-metadata.json)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK versionName is '$actual', expected '$expected'"
            exit 1
          fi
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]
          expected_code=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 10000 + 10#${BASH_REMATCH[3]} * 100))
          actual_code="$(jq -r '.elements[0].versionCode' app/build/outputs/apk/play/release/output-metadata.json)"
          if [[ "$actual_code" != "$expected_code" ]]; then
            echo "::error::APK versionCode is '$actual_code', expected '$expected_code'"
            exit 1
          fi

      - name: Upload unsigned APK and App Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            app/build/outputs/apk/play/release/app-play-release-unsigned.apk
            app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
            app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

  # Runs on a fresh runner with only the APK and App Bundle. The environment can require approval before the
  # signing secrets are used; add required reviewers to it under Settings → Environments.
  sign:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    outputs:
      cert_sha256: ${{ steps.sign.outputs.cert_sha256 }}
      aab_sha256: ${{ steps.sign.outputs.aab_sha256 }}
    steps:
      - name: Download unsigned APK and App Bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned

      - name: Sign APK and App Bundle
        id: sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          out="Crosstune-$TAG.apk"
          # Keeps Gradle's zip layout, so F-Droid can copy this signature onto its own build of the
          # tag and ship this APK. Without it apksigner re-pads entries and the builds don't match.
          # JDK 25 warns, and a later JDK will block, a native call from apksigner's unnamed module.
          # The JDK names this flag. apksigner passes each -J option through to java.
          for flavor in play foss; do
            file="Crosstune-$TAG.apk"
            [[ "$flavor" == "foss" ]] && file="Crosstune-$TAG-foss.apk"
            "$apksigner" -J-enable-native-access=ALL-UNNAMED sign \
              --alignment-preserved \
              --ks "$keystore" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out "$file" \
              "apk/$flavor/release/app-$flavor-release-unsigned.apk"
          done
          # Google Play takes the App Bundle signed with the upload key, which is this same key.
          jarsigner \
            -keystore "$keystore" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD \
            -keypass:env RELEASE_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "Crosstune-$TAG.aab" \
            bundle/playRelease/app-play-release.aab \
            "$RELEASE_KEY_ALIAS"
          # Verify against the upload key in this keystore. A check with no keystore uses the
          # public CA store, and warns because an Android upload key is self-signed.
          jarsigner -verify \
            -keystore "$keystore" \
            -storepass:env RELEASE_KEYSTORE_PASSWORD \
            "Crosstune-$TAG.aab"
          # The App Bundle as signed and verified. The release's notes carry this digest, and promote.yml compares
          # it with the bundle Google Play has, so only a bundle this workflow made reaches production.
          aab_sha256="$(sha256sum "Crosstune-$TAG.aab" | cut -d' ' -f1)"
          if [[ ! "$aab_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read the App Bundle's SHA-256"
            exit 1
          fi
          echo "aab_sha256=$aab_sha256" >> "$GITHUB_OUTPUT"
          certs="$("$apksigner" -J-enable-native-access=ALL-UNNAMED verify --print-certs "$out")"
          echo "$certs"
          # apksigner labels the line "Signer #1" or "V3.0 Signer" depending on the signature schemes used.
          cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$certs" | head -n1)"
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::Could not read the signing certificate digest"
            exit 1
          fi
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Crosstune-${{ env.TAG }}
          path: |
            Crosstune-${{ env.TAG }}.apk
            Crosstune-${{ env.TAG }}-foss.apk
          if-no-files-found: error

      # For Google Play, signed once, here, with no keystore where the Play key is. The GitHub release keeps it
      # too, for an upload in Play Console by hand.
      - name: Upload signed App Bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Crosstune-${{ env.TAG }}-play
          path: Crosstune-${{ env.TAG }}.aab
          if-no-files-found: error

  # Rebuilds the commit from scratch with a different JDK and checks that the signed APK's signature
  # fits it, as F-Droid does before shipping our APK. If it doesn't, F-Droid would skip this version.
  verify:
    needs: sign
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build unsigned APKs
        run: ./gradlew :app:assemblePlayRelease :app:assembleFossRelease --no-build-cache

      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Crosstune-${{ env.TAG }}

      - name: Compare with the signed APK
        run: |
          sudo timeout 60 apt-get update -q || echo "::notice::apt-get update did not finish"
          sudo apt-get -o Acquire::Retries=5 install -y -q apksigcopier
          # apksigcopier calls apksigner. The same JDK flag as the sign job, through a wrapper,
          # because apksigcopier does not take apksigner's -J options.
          tools="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          bindir="$RUNNER_TEMP/apk-bin"
          mkdir -p "$bindir"
          cat > "$bindir/apksigner" << EOF
          #!/bin/bash
          exec "$tools/apksigner" -J-enable-native-access=ALL-UNNAMED "\$@"
          EOF
          chmod +x "$bindir/apksigner"
          PATH="$bindir:$tools:$PATH"
          for flavor in play foss; do
            file="Crosstune-$TAG.apk"
            [[ "$flavor" == "foss" ]] && file="Crosstune-$TAG-foss.apk"
            if ! apksigcopier compare "$file" --unsigned "app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"; then
              echo "::error::The signed $flavor APK doesn't match a fresh build, so F-Droid can't ship it"
              exit 1
            fi
          done

  publish:
    needs: [build, sign, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Crosstune-${{ env.TAG }}

      # The app's update check and the site take the .apk only.
      - name: Download signed App Bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Crosstune-${{ env.TAG }}-play

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ needs.sign.outputs.cert_sha256 }}
          AAB_SHA256: ${{ needs.sign.outputs.aab_sha256 }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # The App Bundle here is the one the sign job signed, not another that took its place on the way.
          if [[ ! "$AAB_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The sign job gave no SHA-256 for the App Bundle, so no release was made"
            exit 1
          fi
          if ! echo "$AAB_SHA256  Crosstune-$TAG.aab" | sha256sum --check --quiet -; then
            echo "::error::Crosstune-$TAG.aab isn't the App Bundle that was signed, so no release was made"
            exit 1
          fi
          # Lets users and tools like Obtainium check the APK's signer before installing. The App Bundle's SHA-256
          # lets promote.yml check that the bundle Google Play has is the one this workflow made. Its line is read
          # back by .github/play/play.rb, so they change together.
          notes="Signing certificate SHA-256: \`$CERT_SHA256\`"$'\n\n'"App Bundle SHA-256: \`$AAB_SHA256\`"
          args=(--repo "$GITHUB_REPOSITORY" --title "Crosstune $TAG" --notes "$notes" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            # Create the tag on the built commit.
            args+=(--target "$GITHUB_SHA")
          fi
          # A version as one string that sorts as the versions do: X, Y and Z, then 1 for X.Y.Z itself, or 0 for a
          # test version with a suffix, which comes before it.
          key() {
            [[ "$1" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]
            printf '%010d%010d%010d%d' "$((10#${BASH_REMATCH[1]}))" "$((10#${BASH_REMATCH[2]}))" \
              "$((10#${BASH_REMATCH[3]}))" "$([[ -z "${BASH_REMATCH[4]}" ]] && echo 1 || echo 0)"
          }
          # The releases out as vX.Y.Z: no draft, no pre-release, and no test version from before they were marked.
          out="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.tag_name, .draft, .prerelease] | @tsv')"
          mine="$(key "$TAG")"
          start="" start_key=""
          while IFS=$'\t' read -r tag draft prerelease; do
            if [[ "$draft" == false && "$prerelease" == false && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$(key "$tag")"
              if [[ "$version" < "$mine" && "$version" > "$start_key" ]]; then
                start="$tag" start_key="$version"
              fi
            fi
          done <<< "$out"
          # The notes list what changed since the final release before, never since its own test versions.
          if [[ -n "$start" ]]; then
            args+=(--notes-start-tag "$start")
          fi
          # The app's update check and the site's download button offer the latest release. A pre-release is
          # never the latest.
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "Crosstune-$TAG.apk" "Crosstune-$TAG-foss.apk" "Crosstune-$TAG.aab" "${args[@]}"

  # Sends the signed App Bundle and its release notes to Google Play's internal testing, then the same release
  # on to each testing track in the PLAY_TRACKS repository variable (beta when it isn't set), with the store
  # listing, in one edit: one review a release. Production is a step of its own, promote.yml. Skipped until the
  # PLAY_SERVICE_ACCOUNT_JSON secret is set; see "Releasing" in CONTRIBUTING.md. Skipped for a pre-release too:
  # Play takes each version code once, and v2.27.0-rc.1 has the one of 2.27.0, which 2.27.0 itself needs.
  # A test version never goes to Play. When Play has a newer version, as for an older tag's release run again,
  # play.sh sends nothing and the job fails.
  play:
    needs: [build, sign, publish]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions: {}
    # One Google Play job at a time, across the release, promote and store listing workflows: Play takes one edit
    # of an app at a time. GitHub keeps one job waiting in the group: a newer one cancels it, so re-run that one.
    concurrency:
      group: google-play
      cancel-in-progress: false
    steps:
      # Only the tools that talk to Google Play and the store text, so none of the build's code is checked out
      # where the Play key is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/play
            fastlane/metadata/android
          sparse-checkout-cone-mode: false

      - name: Download signed App Bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Crosstune-${{ env.TAG }}-play

      # Bundler and fastlane at the versions Gemfile.lock pins and checks, before the key is there: installing a
      # gem runs its own code.
      - name: Install fastlane
        run: .github/play/play.sh setup

      # Every commit asks Google Play to keep a review in progress. While one is, Play refuses it, nothing is
      # sent, and the job says to re-run it when the review ends. A re-run doesn't send the bundle twice.
      - name: Upload to Google Play
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # The testing tracks, with commas between, e.g. "beta,alpha" to send closed testing the same release.
          PLAY_TRACKS: ${{ vars.PLAY_TRACKS }}
          # The listing's languages: folders of fastlane/metadata/android, with spaces between.
          PLAY_LANGUAGES: ${{ vars.PLAY_LANGUAGES }}
          OLD_PLAY_TRACK: ${{ vars.PLAY_TRACK }}
        run: |
          if [[ -z "$PLAY_KEY_JSON" ]]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON isn't set, so the App Bundle wasn't sent to Google Play"
            exit 0
          fi
          if [[ -n "$OLD_PLAY_TRACK" ]]; then
            echo "::warning::The PLAY_TRACK variable isn't read any more. PLAY_TRACKS names the testing tracks, and promote.yml sends a release to production"
          fi
          .github/play/play.sh release "$TAG"
