name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the selected branch (e.g. v1.0.7)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Three jobs, so the build's third-party code (Gradle plugins and dependencies) never runs
# where the signing key or a token that can write to the repository is available.
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::Tag $TAG already exists; push it to trigger a release instead"
              exit 1
            fi
            # Tag locally before building so the Git-derived version matches the release.
            git tag "$TAG"
          fi
          if ! git tag --points-at HEAD | grep -qxF "$TAG"; then
            echo "::error::Tag $TAG doesn't point at the commit being built"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The same checks as CI, which also build the minified release APK.
      - name: Test, lint and build
        run: ./gradlew :app:ci --build-cache -PreleaseTag="$TAG"

      - name: Verify version metadata
        run: |
          expected="${TAG#v}"
          actual="$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK versionName is '$actual', expected '$expected'"
            exit 1
          fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  # Runs on a fresh runner with only the APK. The environment can require approval before the
  # signing secrets are used; add required reviewers to it under Settings → Environments.
  sign:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions: {}
    outputs:
      cert_sha256: ${{ steps.sign.outputs.cert_sha256 }}
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned

      - name: Sign APK
        id: sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing secret $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          out="Crosstune-$TAG.apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$out" \
            app-release-unsigned.apk
          certs="$("$apksigner" verify --print-certs "$out")"
          echo "$certs"
          # apksigner labels the line "Signer #1" or "V3.0 Signer" depending on the signature schemes used.
          cert_sha256="$(sed -n 's/^.*certificate SHA-256 digest: //p' <<< "$certs" | head -n1)"
          if [[ -z "$cert_sha256" ]]; then
            echo "::error::Could not read the signing certificate digest"
            exit 1
          fi
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Crosstune-${{ env.TAG }}
          path: Crosstune-${{ env.TAG }}.apk
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Crosstune-${{ env.TAG }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ needs.sign.outputs.cert_sha256 }}
        run: |
          # Lets users and tools like Obtainium check the APK's signer before installing.
          notes="Signing certificate SHA-256: \`$CERT_SHA256\`"
          args=(--repo "$GITHUB_REPOSITORY" --title "Crosstune $TAG" --notes "$notes" --generate-notes)
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            # The tag only existed in the build job; gh creates it on the built commit.
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "Crosstune-$TAG.apk" "${args[@]}"
