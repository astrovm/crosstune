name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools || true
          java -version || true; ls /usr/lib/jvm || true
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/core/core-ktx androidx/lifecycle/lifecycle-runtime-ktx androidx/activity/activity-compose com/google/android/material/material androidx/datastore/datastore-preferences androidx/room/room-runtime androidx/camera/camera-core com/google/mlkit/pose-detection com/google/mlkit/pose-detection-accurate androidx/test/ext/junit androidx/test/espresso/espresso-core androidx/test/core androidx/test/runner androidx/compose/ui/ui-test-junit4 androidx/work/work-runtime; do
            echo "$a: $(curl -s https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -12 | tr '\n' ' ')"
          done
          curl -s https://dl.google.com/android/repository/repository2-3.xml | grep -o 'path="platforms;android-[^"]*"\|path="build-tools;[^"]*"' | tail -8
