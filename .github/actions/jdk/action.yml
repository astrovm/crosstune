name: JDK and Gradle
description: >-
  The JDK every job builds with, Gradle with its caches, and the Kotlin compiler's jars that
  scripts/kotlinc/kotlinc.lock names, as a job asks. It needs the checkout first.

inputs:
  gradle:
    description: >-
      Gradle's caches: read-write (saved by main's runs of CI only, as setup-gradle decides), read-only,
      disabled, or none for a job that runs no Gradle.
    default: read-write
  kotlinc:
    description: true fetches the Kotlin compiler's jars into build/kotlinc, for the readings guard and syncreplay.
    default: "false"

outputs:
  dependencies-key:
    description: The key for the shared Gradle dependency cache.
    value: ${{ steps.dependencies.outputs.cache-primary-key }}
  dependencies-hit:
    description: Whether the shared dependency cache matched the key exactly.
    value: ${{ steps.dependencies.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "25"

    - if: inputs.kotlinc == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/kotlinc
        key: kotlinc-${{ hashFiles('scripts/kotlinc/kotlinc.lock') }}

    - if: inputs.kotlinc == 'true'
      name: Fetch the locked Kotlin compiler
      shell: bash
      run: python3 scripts/kotlinc/kotlinc.py fetch

    # Three steps, not one with inputs: read-write leaves setup-gradle's own default, which saves only on main.
    - if: inputs.gradle == 'read-write'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # One complete dependency cache comes from the test job, not a different one per job.
        gradle-home-cache-excludes: caches/modules-2

    # Main's runs of CI save the caches; this one only reads them.
    - if: inputs.gradle == 'read-only'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: true
        gradle-home-cache-excludes: caches/modules-2

    # Restore after setup-gradle so its other caches do not mask this shared set of dependencies.
    - if: inputs.gradle == 'read-write' || inputs.gradle == 'read-only'
      id: dependencies
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/modules-2
          !~/.gradle/caches/modules-2/modules-2.lock
          !~/.gradle/caches/modules-2/gc.properties
        # A changed build file or gradle.properties gets a fresh key. Bump v1 if a repository
        # changes an artifact without changing those files, since an exact hit cannot be updated.
        key: gradle-shared-dependencies-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'gradle/*.versions.toml', '**/versions.properties') }}
        restore-keys: gradle-shared-dependencies-v1-${{ runner.os }}-

    - if: inputs.gradle == 'disabled'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-disabled: true

    - if: ${{ !contains(fromJSON('["read-write", "read-only", "disabled", "none"]'), inputs.gradle) }}
      shell: bash
      env:
        GRADLE: ${{ inputs.gradle }}
      run: |
        echo "::error::gradle is read-write, read-only, disabled or none, not '$GRADLE'"
        exit 1
